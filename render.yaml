services:
  - type: web
    name: cukorvadaszat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: cukorvadaszat-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: cukorvadaszat-db
    plan: free
