<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0f33">
<title>Kenderesi Halloween Cukorvadászat 🎃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg: #150d26;
    --panel: #21143a;
    --panel2: #2f1d52;
    --orange: #ff7a18;
    --orange2: #ffb347;
    --green: #9dff4a;
    --text: #f6eefc;
    --muted: #b9a9d6;
    --danger: #ff5d73;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: linear-gradient(180deg, #2c1655, #1b0f33);
    border-bottom: 2px solid var(--orange);
    flex: none;
  }
  h1 {
    margin: 0; font-family: "Creepster", cursive; font-weight: 400;
    font-size: 24px; letter-spacing: 1px; color: var(--orange);
    text-shadow: 0 0 14px rgba(255, 122, 24, .45);
    line-height: 1.05; min-width: 0;
  }
  #count {
    font-size: 14px; font-weight: 700; color: var(--green);
    background: rgba(157, 255, 74, .1); border: 1px solid rgba(157, 255, 74, .35);
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
  }

  .hright { display: flex; align-items: center; gap: 8px; }
  .admin-badge {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: #2a1200;
    background: linear-gradient(180deg, var(--orange2), var(--orange)); border: 0;
    padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  }

  @media (max-width: 400px) {
    h1 { font-size: 20px; }
    #count { padding: 5px 9px; font-size: 13px; }
    .admin-badge { padding: 5px 8px; font-size: 12px; }
    header { padding-left: 12px; padding-right: 12px; }
  }

  /* A térkép saját rétegkontextusba kerül: a Leaflet (z-index 400–1000) és a 📍 célkereszt
     így csak a térképen belül rétegeződik, a lista / űrlap / értesítés mindig fölötte marad. */
  #mapwrap { position: relative; z-index: 0; isolation: isolate; flex: 1; min-height: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; z-index: 0; isolation: isolate; background: #0e0819; }
  /* sötét, lilás Halloween-hangulat a sima OSM csempékből (API kulcs nélkül) */
  #map .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(.85) contrast(.95) saturate(.7); }

  #crosshair {
    position: absolute; left: 50%; top: 50%; z-index: 1; pointer-events: none;
    transform: translate(-50%, -100%); font-size: 44px; line-height: 1;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6));
    display: none;
  }
  #crosshair::after {
    content: ""; position: absolute; left: 50%; bottom: -4px; width: 10px; height: 10px;
    transform: translateX(-50%); border-radius: 50%; background: var(--orange);
    box-shadow: 0 0 0 4px rgba(255, 122, 24, .3);
  }
  body.adding:not(.sheet-open) #crosshair { display: block; }

  .bottom { position: relative; z-index: 1000; flex: none; background: var(--panel); border-top: 2px solid var(--orange);
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }

  #bar { display: flex; gap: 10px; }
  body.adding #bar { display: none; }

  #addpanel { display: none; }
  body.adding #addpanel { display: block; }

  .btn {
    min-height: 50px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 700;
    padding: 0 16px; cursor: pointer; color: var(--text); background: var(--panel2);
    font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .6; }
  .btn.primary { background: linear-gradient(180deg, var(--orange2), var(--orange)); color: #2a1200; }
  #bar .btn { flex: 1 1 auto; white-space: nowrap; padding: 0 12px; }
  @media (max-width: 400px) { #bar { gap: 8px; } #bar .btn { font-size: 15px; padding: 0 8px; } }

  .field { display: block; margin-bottom: 10px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin: 0 2px 4px; text-transform: uppercase; letter-spacing: .5px; }
  input[type=text], textarea {
    width: 100%; border: 1px solid #4a3378; background: #170d2b; color: var(--text);
    border-radius: 12px; padding: 12px; font-size: 16px; font-family: inherit;
  }
  textarea { resize: none; height: 56px; }
  input:focus, textarea:focus { outline: 2px solid var(--orange); border-color: transparent; }
  #coordHint { display: none; color: var(--danger); font-size: 13px; margin: -4px 2px 8px; }
  #coordHint.info { color: var(--muted); }

  /* címjavaslatok (a panel a képernyő alján van, ezért felfelé nyílik) */
  .ac { position: relative; }
  .suggest {
    position: absolute; left: 0; right: 0; bottom: calc(100% - 6px); z-index: 10;
    list-style: none; margin: 0; padding: 4px; max-height: 38vh; max-height: 38dvh; overflow-y: auto;
    background: var(--panel2); border: 1px solid var(--orange); border-radius: 14px;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, .55); display: none;
  }
  .suggest.show { display: block; }
  /* amíg a lista nyitva van, a többi mező eltűnik, hogy a billentyűzet mellett is elférjen */
  body.sug-open .hide-on-sug { display: none !important; }
  body.sug-open .field { margin-bottom: 0; }
  .suggest li { display: flex; flex-direction: column; gap: 1px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .suggest li + li { border-top: 1px solid rgba(255, 255, 255, .06); }
  .suggest li:active, .suggest li.hl { background: rgba(255, 122, 24, .22); }
  .suggest strong { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggest span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggest li.status { cursor: default; color: var(--muted); font-size: 13px; flex-direction: row; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .row .btn.primary { flex: 2; }
  .tip { font-size: 13px; color: var(--muted); margin: 0 2px 10px; }

  /* lista (alulról kicsúszó panel) */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
    max-height: 70vh; max-height: 70dvh; display: flex; flex-direction: column;
    background: var(--panel); border-top: 2px solid var(--orange);
    border-radius: 20px 20px 0 0; transform: translateY(105%); transition: transform .25s ease;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .5);
  }
  #sheet.open { transform: none; }
  #sheet .head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  #sheet h2 { margin: 0; font-size: 18px; color: var(--orange2); }
  #sheet .x { background: none; border: 0; color: var(--muted); font-size: 28px; line-height: 1; padding: 4px 8px; cursor: pointer; }
  #list { list-style: none; margin: 0; padding: 0 12px 12px; overflow-y: auto; }
  #list li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px; margin-bottom: 8px; border-radius: 12px; background: var(--panel2); cursor: pointer;
  }
  #list li.gone { opacity: .55; }
  #list li.empty { cursor: default; justify-content: center; color: var(--muted); }
  .li-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .li-main strong { overflow: hidden; text-overflow: ellipsis; }
  .li-main span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list em { font-style: normal; font-size: 13px; color: var(--green); white-space: nowrap; font-weight: 700; }

  /* jelölők */
  .candy-pin span {
    display: grid; place-items: center; width: 38px; height: 38px; font-size: 22px;
    border-radius: 50%; background: var(--panel2); border: 3px solid var(--orange);
    box-shadow: 0 0 14px rgba(255, 122, 24, .7), 0 3px 6px rgba(0, 0, 0, .5);
  }
  .candy-pin.gone span { border-color: #6b6280; box-shadow: none; filter: grayscale(1); opacity: .75; }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #3ea6ff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(62, 166, 255, .3); }

  /* popup */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .leaflet-popup-content-wrapper { border-radius: 16px; border: 1px solid var(--orange); }
  .leaflet-popup-content { margin: 14px 16px; font-family: inherit; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .pop h3 { margin: 0 20px 6px 0; font-size: 17px; color: var(--orange2); }
  .pop p { margin: 0 0 8px; font-size: 14px; line-height: 1.35; }
  .pop .meta { color: var(--green); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .pop .badge { display: inline-block; background: rgba(255, 93, 115, .18); color: var(--danger); border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .pop .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .pop .btn { min-height: 42px; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text); text-align: center; }
  .pop .btn.primary { color: #2a1200; }
  .pop .btn.danger { background: rgba(255, 93, 115, .2); color: var(--danger); }
  .leaflet-control-attribution { background: rgba(21, 13, 38, .75) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--orange2) !important; }
  .leaflet-bar a { background: var(--panel); color: var(--text); border-color: #4a3378; }

  #toast {
    position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); z-index: 3000;
    transform: translate(-50%, -20px); opacity: 0; pointer-events: none; transition: all .25s ease;
    background: var(--orange); color: #2a1200; font-weight: 700; padding: 10px 16px; border-radius: 999px;
    max-width: 90vw; text-align: center; box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <header>
    <h1>Kenderesi Halloween Cukorvadászat 🎃</h1>
    <div class="hright">
      <button id="adminBadge" class="admin-badge" style="display:none" title="Admin mód – koppints a kilépéshez">🔑 Admin</button>
      <div id="count">… hely</div>
    </div>
  </header>

  <div id="mapwrap">
    <div id="map"></div>
    <div id="crosshair">📍</div>
  </div>

  <div class="bottom">
    <div id="bar">
      <button class="btn primary" id="btnAdd">➕ Új hely</button>
      <button class="btn" id="btnLocate" aria-label="Hol vagyok?">📍 Hol vagyok?</button>
      <button class="btn" id="btnList">📋 Lista</button>
    </div>

    <div id="addpanel">
      <p class="tip hide-on-sug" id="addTip">Told a térképet úgy, hogy a 📍 a megfelelő helyre mutasson – vagy illessz be koordinátát / Google Térkép linket.</p>
      <div class="ac">
        <label class="field"><span>Hely neve / címe</span>
          <input type="text" id="name" maxlength="60" placeholder="Kezdj el írni egy címet, pl. Kossuth u. 12" autocomplete="off" autocorrect="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        </label>
        <ul id="suggest" class="suggest" role="listbox"></ul>
      </div>
      <label class="field hide-on-sug"><span>Megjegyzés (nem kötelező)</span>
        <textarea id="note" maxlength="200" placeholder="pl. Kit-Kat és Snickers, 6-ig van otthon"></textarea>
      </label>
      <label class="field hide-on-sug"><span>Koordináta vagy Google Térkép link (mobilos is jó)</span>
        <input type="text" id="coords" placeholder="47.49791, 19.04024 vagy https://maps.app.goo.gl/…" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div id="coordHint" class="hide-on-sug"></div>
      <div class="row hide-on-sug" style="margin-bottom:10px">
        <button class="btn" id="btnHere">📍 Saját helyzetem</button>
      </div>
      <div class="row hide-on-sug">
        <button class="btn" id="btnCancel">Mégse</button>
        <button class="btn primary" id="btnSave">🍬 Mentés</button>
      </div>
    </div>
  </div>

  <div id="sheet" aria-hidden="true">
    <div class="head">
      <h2>🍬 Összes hely</h2>
      <button class="x" id="btnClose" aria-label="Bezár">×</button>
    </div>
    <ul id="list"></ul>
  </div>

  <div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  // Admin kulcs: ?admin=KULCS a linkben, utána a böngésző megjegyzi
  var urlParams = new URLSearchParams(location.search);
  var ADMIN = urlParams.get('admin') || '';
  if (!ADMIN) { try { ADMIN = localStorage.getItem('cv_admin') || ''; } catch (e) { /* nincs tárhely */ } }
  var isAdmin = false;
  var publicStatus = true;

  function el(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (ADMIN) headers['x-admin-token'] = ADMIN;
    return fetch(path, Object.assign({}, opts, { headers: headers })).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok) throw new Error((data && data.error) || 'Hiba történt (' + res.status + ')');
        return data;
      });
    });
  }

  function fmtDist(m) { return m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km'; }

  /* ---------------------------- térkép ---------------------------- */
  var map = L.map('map', { zoomControl: false, tap: true }).setView([47.1625, 19.5033], 7);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); }).observe($('#mapwrap'));

  var spots = [];
  var markers = new Map();
  var sigs = new Map();
  var me = null;
  var meMarker = null;

  function iconFor(s) {
    var gone = s.status === 'elfogyott';
    return L.divIcon({
      className: 'candy-pin' + (gone ? ' gone' : ''),
      html: '<span>' + (gone ? '💀' : '🍬') + '</span>',
      iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -18]
    });
  }

  function buildPopup(s) {
    var gone = s.status === 'elfogyott';
    var box = el('div', { class: 'pop' }, el('h3', { text: s.name }));
    if (gone) box.append(el('div', { class: 'badge', text: 'Elfogyott a cukor 💀' }));
    if (s.note) box.append(el('p', { text: s.note }));
    if (me) box.append(el('div', { class: 'meta', text: '≈ ' + fmtDist(me.distanceTo([s.lat, s.lng])) + ' tőled' }));

    var actions = el('div', { class: 'actions' });
    actions.append(el('a', {
      class: 'btn primary', target: '_blank', rel: 'noopener',
      href: 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng,
      text: '🧭 Útvonal a Google Térképen'
    }));
    actions.append(el('a', {
      class: 'btn', target: '_blank', rel: 'noopener',
      href: 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lng,
      text: '🗺️ Megnyitás Google Térképen'
    }));
    if (isAdmin) actions.append(el('button', { class: 'btn', text: '✏️ Hely szerkesztése', onclick: function () { startEdit(s); } }));
    if (isAdmin) actions.append(el('button', { class: 'btn danger', text: '🗑️ Hely törlése', onclick: function () { removeSpot(s); } }));
    box.append(actions);
    return box;
  }

  function render() {
    var seen = new Set();
    spots.forEach(function (s) {
      seen.add(s.id);
      var sig = [s.name, s.note, s.lat, s.lng, s.status].join('|');
      var m = markers.get(s.id);
      if (!m) {
        m = L.marker([s.lat, s.lng], { icon: iconFor(s), title: s.name }).addTo(map);
        markers.set(s.id, m);
      } else if (sigs.get(s.id) === sig) {
        return; // nem változott – ne zárjuk be a nyitott popupot
      } else {
        m.setLatLng([s.lat, s.lng]);
        m.setIcon(iconFor(s));
      }
      m.unbindPopup();
      m.bindPopup(function () { return buildPopup(s); }, { maxWidth: 280, minWidth: 220 });
      sigs.set(s.id, sig);
    });
    markers.forEach(function (m, id) {
      if (!seen.has(id)) { m.remove(); markers.delete(id); sigs.delete(id); }
    });
    var active = spots.filter(function (s) { return s.status !== 'elfogyott'; }).length;
    $('#count').textContent = active + ' hely';
    renderList();
  }

  function renderList() {
    var ul = $('#list');
    ul.textContent = '';
    var items = spots.slice();
    if (me) items.sort(function (a, b) { return me.distanceTo([a.lat, a.lng]) - me.distanceTo([b.lat, b.lng]); });
    else items.sort(function (a, b) { return b.id - a.id; });

    if (!items.length) {
      ul.append(el('li', { class: 'empty', text: 'Még nincs egyetlen hely sem. Légy te az első! 🍬' }));
      return;
    }
    items.forEach(function (s) {
      var gone = s.status === 'elfogyott';
      ul.append(el('li', {
        class: gone ? 'gone' : '',
        onclick: function () { closeSheet(); focusSpot(s.id); }
      },
        el('div', { class: 'li-main' },
          el('strong', { text: (gone ? '💀 ' : '🍬 ') + s.name }),
          s.note ? el('span', { text: s.note }) : null),
        me ? el('em', { text: fmtDist(me.distanceTo([s.lat, s.lng])) }) : null));
    });
  }

  function focusSpot(id) {
    var m = markers.get(id);
    if (!m) return;
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 16), { animate: true });
    m.openPopup();
  }

  function fitAll() {
    if (!spots.length) return;
    var b = L.latLngBounds(spots.map(function (s) { return [s.lat, s.lng]; }));
    map.fitBounds(b, { padding: [50, 50], maxZoom: 16 });
  }

  function load(first) {
    return api('/api/spots').then(function (data) {
      spots = data;
      render();
      if (first) fitAll();
    }).catch(function () {
      if (first) toast('Nem sikerült betölteni a helyeket');
    });
  }

  function setStatus(s, status) {
    api('/api/spots/' + s.id + '/status', { method: 'POST', body: JSON.stringify({ status: status }) })
      .then(function (u) {
        spots = spots.map(function (x) { return x.id === u.id ? u : x; });
        map.closePopup();
        render();
        toast(status === 'elfogyott' ? 'Megjelölve: elfogyott 💀' : 'Megjelölve: van még cukor 🍬');
      }).catch(function (e) { toast(e.message); });
  }

  function removeSpot(s) {
    if (!confirm('Biztosan törlöd végleg: ' + s.name + '?')) return;
    api('/api/spots/' + s.id, { method: 'DELETE' }).then(function () {
      spots = spots.filter(function (x) { return x.id !== s.id; });
      map.closePopup();
      render();
      toast('Törölve');
    }).catch(function (e) { toast(e.message); });
  }

  /* -------------------------- saját helyzet -------------------------- */
  function locate(cb) {
    if (!navigator.geolocation) { toast('A böngésző nem támogatja a helymeghatározást'); return; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      me = L.latLng(pos.coords.latitude, pos.coords.longitude);
      if (meMarker) meMarker.setLatLng(me);
      else meMarker = L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, keyboard: false }).addTo(map);
      map.setView(me, Math.max(map.getZoom(), 16), { animate: true });
      renderList();
      if (cb) cb();
    }, function (err) {
      toast(err.code === 1 ? 'Engedélyezd a helymeghatározást a böngészőben' : 'Nem sikerült meghatározni a helyzeted');
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  /* ------------------------ új hely felvétele ------------------------ */
  var coordsInput = $('#coords');

  function parseCoords(text) {
    text = String(text || '').trim();
    if (!text) return null;
    var num = '(-?\\d{1,3}(?:\\.\\d+)?)';
    var sep = '(?:,|%2C|\\+|%20|\\s)+';
    var m = text.match(new RegExp('!3d' + num + '!4d' + num)) ||
            text.match(new RegExp('[?&;](?:q|query|ll|sll|center|destination|daddr)=(?:loc:|loc%3A)?\\+?' + num + sep + num, 'i')) ||
            text.match(new RegExp('/(?:place|search|dir)/' + num + ',' + num + '(?:[/?@]|$)')) ||
            text.match(new RegExp('@' + num + ',' + num)) ||
            text.match(new RegExp('^' + num + '\\s*[,;\\s]\\s*' + num + '$'));
    if (!m) return null;
    var lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: lat, lng: lng };
  }

  function setHint(msg, info) {
    var hint = $('#coordHint');
    if (!msg) { hint.style.display = 'none'; return; }
    hint.textContent = msg;
    hint.className = info ? 'info' : '';
    hint.style.display = 'block';
  }

  function syncCoords() {
    if (!document.body.classList.contains('adding') || document.activeElement === coordsInput) return;
    var c = map.getCenter();
    coordsInput.value = c.lat.toFixed(5) + ', ' + c.lng.toFixed(5);
    setHint('');
  }
  map.on('move', syncCoords);

  /* A 📍 azonnal a kiválasztott helyre kerül: a térkép méretváltozásai (billentyűzet, lista bezárása)
     közben többször újra középre igazítunk, amíg a felhasználó el nem húzza a térképet. */
  var settleTimers = [], programmatic = false;
  function cancelSettle() { settleTimers.forEach(clearTimeout); settleTimers = []; }
  map.on('dragstart', cancelSettle);
  map.on('zoomstart', function () { if (!programmatic) cancelSettle(); });

  function placePin(lat, lng) {
    cancelSettle();
    var target = L.latLng(lat, lng);
    function go(last) {
      programmatic = true;
      try {
        map.invalidateSize({ animate: false, pan: false });
        map.setView(target, Math.max(map.getZoom(), 17), { animate: false });
      } finally { programmatic = false; }
      if (last && document.activeElement !== coordsInput) {
        coordsInput.value = target.lat.toFixed(5) + ', ' + target.lng.toFixed(5);
      }
    }
    go(false);
    [60, 150, 350, 700, 1100].forEach(function (ms, i, arr) {
      settleTimers.push(setTimeout(function () { go(i === arr.length - 1); }, ms));
    });
  }

  function hasLink(t) { return /https?:\/\/[^\s\/]+\.[a-z]{2,}/i.test(t); }

  /* Rövid mobilos linkek (maps.app.goo.gl/…) feloldása a szerveren keresztül */
  var resolveSeq = 0, resolveTimer;
  function resolveInto(text) {
    var seq = ++resolveSeq;
    setHint('⏳ Link feloldása…', true);
    var mc = map.getCenter();
    return api('/api/resolve?url=' + encodeURIComponent(text) + '&lat=' + mc.lat.toFixed(3) + '&lng=' + mc.lng.toFixed(3)).then(function (r) {
      if (seq !== resolveSeq) return null; // közben átírták a mezőt
      if (r.approx) {
        // Nincs pontos koordináta a linkben – a felhasználó választja ki a helyeset
        setHint('');
        showSug(r.candidates, 'A linkből csak a név derül ki („' + (r.name || '?') + '”). Melyik ez a hely?', {
          keepName: true, fallbackName: r.name, closeRow: true
        });
        return null;
      }
      coordsInput.value = r.lat.toFixed(5) + ', ' + r.lng.toFixed(5);
      setHint('');
      placePin(r.lat, r.lng);
      if (r.name && !$('#name').value.trim()) $('#name').value = r.name.slice(0, 60);
      toast('Link feloldva ✔');
      return { lat: r.lat, lng: r.lng };
    }).catch(function (e) {
      if (seq === resolveSeq) setHint(e.message || 'Nem sikerült feloldani a linket.');
      return null;
    });
  }

  coordsInput.addEventListener('input', function () {
    clearTimeout(resolveTimer);
    resolveSeq++;
    var v = coordsInput.value, c = parseCoords(v);
    if (c) { setHint(''); map.setView([c.lat, c.lng], Math.max(map.getZoom(), 17), { animate: false }); return; }
    if (!v.trim()) { setHint(''); return; }
    if (hasLink(v)) { resolveTimer = setTimeout(function () { resolveInto(v); }, 500); return; }
    setHint('Ezt nem ismerem fel. Írj be „szélesség, hosszúság” formát, vagy illeszd be a Google Térkép linket.');
  });
  coordsInput.addEventListener('blur', syncCoords);

  /* ------------------------- címjavaslatok ------------------------- */
  var nameInput = $('#name'), sug = $('#suggest'), sugTimer, sugSeq = 0;

  // A lista magassága = a látható terület (billentyűzet nélkül) és a mező teteje közötti hely
  function fitSug() {
    if (!sug.classList.contains('show')) return;
    var vv = window.visualViewport;
    var top = vv ? vv.offsetTop : 0;
    var avail = $('.ac').getBoundingClientRect().top - top - 8;
    sug.style.maxHeight = Math.max(60, Math.min(320, avail)) + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSug);
    window.visualViewport.addEventListener('scroll', fitSug);
  }
  window.addEventListener('resize', fitSug);

  function hideSug() {
    document.body.classList.remove('sug-open');
    sug.classList.remove('show');
    sug.textContent = '';
    nameInput.setAttribute('aria-expanded', 'false');
  }
  function showSug(items, statusText, opts) {
    opts = opts || {};
    sug.textContent = '';
    if (statusText) sug.append(el('li', { class: 'status', text: statusText }));
    items.forEach(function (it) {
      sug.append(el('li', {
        role: 'option',
        // mousedown-nál ne vegye el a fókuszt a mezőtől, különben a lista előbb eltűnik, mint a koppintás
        onmousedown: function (e) { e.preventDefault(); },
        onclick: function () { pickSug(it, opts); }
      }, el('strong', { text: it.title }), it.sub ? el('span', { text: it.sub }) : null));
    });
    if (opts.closeRow) sug.append(el('li', { class: 'status', text: '✕ Egyik sem – bezárás', onclick: hideSug }));
    sug.classList.add('show');
    document.body.classList.add('sug-open');
    nameInput.setAttribute('aria-expanded', 'true');
    fitSug();
    requestAnimationFrame(fitSug);
    setTimeout(fitSug, 250); // a billentyűzet animációja után még egyszer
  }
  function pickSug(it, opts) {
    opts = opts || {};
    sugSeq++;
    if (!opts.keepName) nameInput.value = it.title.slice(0, 60);
    else if (!nameInput.value.trim()) nameInput.value = (opts.fallbackName || it.title).slice(0, 60);
    hideSug();
    coordsInput.value = it.lat.toFixed(5) + ', ' + it.lng.toFixed(5);
    setHint('');
    nameInput.blur(); // mobilon becsukja a billentyűzetet, így látszik a térkép
    placePin(it.lat, it.lng);
  }

  nameInput.addEventListener('input', function () {
    clearTimeout(sugTimer);
    var q = nameInput.value.trim();
    var seq = ++sugSeq;
    if (q.length < 3) { hideSug(); return; }
    sugTimer = setTimeout(function () {
      var c = map.getCenter();
      api('/api/geocode?q=' + encodeURIComponent(q) + '&lat=' + c.lat.toFixed(4) + '&lng=' + c.lng.toFixed(4))
        .then(function (items) {
          if (seq !== sugSeq || document.activeElement !== nameInput) return;
          if (items.length) showSug(items);
          else showSug([], 'Nincs találat – a beírt név így is használható');
        })
        .catch(function () { if (seq === sugSeq) hideSug(); });
    }, 350);
  });
  map.on('click dragstart', function () { if (sug.classList.contains('show')) { sugSeq++; hideSug(); } });
  nameInput.addEventListener('blur', function () { sugSeq++; clearTimeout(sugTimer); hideSug(); });

  function startAdd() {
    closeSheet();
    map.closePopup();
    document.body.classList.add('adding');
    if (map.getZoom() < 15) {
      if (me) map.setView(me, 17); else if (!spots.length) map.setView(map.getCenter(), Math.max(map.getZoom(), 12));
    }
    setTimeout(function () { map.invalidateSize(); syncCoords(); }, 50);
  }
  var ADD_TIP = $('#addTip').textContent;
  var EDIT_TIP = '✏️ Hely szerkesztése: írd át a nevet / megjegyzést, vagy told a térképet / keress új címet – a 📍 jelöli az új pozíciót.';
  var editingId = null;

  function startEdit(s) {
    closeSheet();
    map.closePopup();
    editingId = s.id;
    $('#name').value = s.name;
    $('#note').value = s.note || '';
    coordsInput.value = s.lat.toFixed(5) + ', ' + s.lng.toFixed(5);
    $('#addTip').textContent = EDIT_TIP;
    hideSug(); setHint('');
    document.body.classList.add('adding');
    placePin(s.lat, s.lng);
  }

  function cancelAdd() {
    document.body.classList.remove('adding');
    cancelSettle();
    if (editingId !== null) {
      editingId = null;
      $('#name').value = '';
      $('#note').value = '';
      $('#addTip').textContent = ADD_TIP;
    }
    resolveSeq++; hideSug(); setHint('');
    setTimeout(function () { map.invalidateSize(); }, 50);
  }

  function save() {
    var c = parseCoords(coordsInput.value);
    if (!c && hasLink(coordsInput.value)) {
      // még nincs feloldva a (rövid) link – előbb azt oldjuk fel, aztán mentünk
      resolveInto(coordsInput.value).then(function (r) { if (r) save(); });
      return;
    }
    var name = $('#name').value.trim();
    if (!name) { toast('Adj nevet a helynek!'); $('#name').focus(); return; }
    if (!c) { toast('A koordináta nem érvényes'); coordsInput.focus(); return; }
    var btn = $('#btnSave');
    btn.disabled = true;
    var editId = editingId;
    var payload = JSON.stringify({ name: name, note: $('#note').value, lat: c.lat, lng: c.lng });
    (editId !== null
      ? api('/api/spots/' + editId, { method: 'PUT', body: payload })
      : api('/api/spots', { method: 'POST', body: payload }))
      .then(function (s) {
        if (editId !== null) spots = spots.map(function (x) { return x.id === s.id ? s : x; });
        else spots.push(s);
        render();
        cancelAdd();
        $('#name').value = '';
        $('#note').value = '';
        focusSpot(s.id);
        toast(editId !== null ? 'Módosítva ✔' : 'Mentve! 🎃');
      })
      .catch(function (e) { toast(e.message); })
      .then(function () { btn.disabled = false; });
  }

  /* ------------------------------ lista ------------------------------ */
  function openSheet() { hideSug(); document.body.classList.add('sheet-open'); $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false'); }
  function closeSheet() { document.body.classList.remove('sheet-open'); $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); }

  $('#btnAdd').addEventListener('click', startAdd);
  $('#btnCancel').addEventListener('click', cancelAdd);
  $('#btnSave').addEventListener('click', save);
  $('#btnLocate').addEventListener('click', function () { locate(); });
  $('#btnHere').addEventListener('click', function () { locate(syncCoords); });
  $('#btnList').addEventListener('click', openSheet);
  $('#btnClose').addEventListener('click', closeSheet);

  function applyMode() {
    $('#btnAdd').style.display = isAdmin ? '' : 'none';
    $('#adminBadge').style.display = isAdmin ? '' : 'none';
  }

  $('#adminBadge').addEventListener('click', function () {
    if (!confirm('Kilépsz az admin módból ezen az eszközön?')) return;
    try { localStorage.removeItem('cv_admin'); } catch (e) { /* semmi */ }
    location.href = location.pathname;
  });

  // Először megnézzük, admin vagyunk-e, és csak utána töltjük be a helyeket
  api('/api/config').then(function (cfg) {
    isAdmin = !!cfg.admin;
    publicStatus = cfg.publicStatus !== false;
    if (isAdmin) {
      try { localStorage.setItem('cv_admin', ADMIN); } catch (e) { /* semmi */ }
      if (urlParams.get('admin')) history.replaceState(null, '', location.pathname); // kulcs eltüntetése a címsorból
    } else {
      try { localStorage.removeItem('cv_admin'); } catch (e) { /* semmi */ }
      if (urlParams.get('admin')) toast('Hibás admin kulcs');
      ADMIN = '';
    }
  }).catch(function () { /* hiba esetén sima látogatóként megyünk tovább */ })
    .then(function () { applyMode(); load(true); });
  setInterval(load, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
